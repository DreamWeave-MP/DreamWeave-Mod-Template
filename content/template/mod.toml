# The DreamWeave Mod Template as a DreamWeave project: a Jess package, the build tool itself. `jess`
# names the Package Source it publishes, this repository root's own jess.toml, and each release tag
# `template-<version>` is one version of the package, packed by the template from that tag; every
# push to the default branch packs a development build under the dev-build release. A site made
# from this template loses this page on its first push: CI's scaffold step removes it with the
# tool's source, since the copy is a site and not the tool.
id = "74143198-50bf-434b-938e-816699a5d0a4"
slug = "template"
type = "tool"
status = "active"

[[maintainers]]
name = "DreamWeave"
url = "https://github.com/DreamWeave-MP"

[package]
format = "jpk"
jess = "org.dreamweave.mod-template"

[[releases]]
version = "0.4.1"
date = 2026-10-24
summary = "A Jess application goes to Nexus Mods as a program does, each platform's zip to its own file group, and a program can't name a mod's one file group."
fixed = [
    "A project with `application`, or a `binary`, is refused `[nexusmods] file_group_id`, as the Python template refused a binary: its archives go to Nexus one file group per platform, from the `NEXUS_GROUP_IDS` secret, and StroggForge v68 uploads an application's that way. A crate is refused it too.",
]

[[releases]]
version = "0.4.0"
date = 2026-10-23
summary = "Every protocol document is written at schema_version 4, and a Jess package can release an application: a packed workspace and an executable per platform, which jess install installs."
breaking = ["Sites are written at protocol schema_version 4, which jess reads from 0.2.0 on: an older jess can't sync packages from a site built with this release."]
added = ["`[package] application` in mod.toml releases a jpk project as an application too: CI packs it into dist/application with the jess image, named by StroggForge's jess_application input, and the release records the .jsw as a jsw artifact with its jess_workspace block and each platform's executable as a zipped binary artifact."]

[[releases]]
version = "0.3.2"
date = 2026-10-21
summary = "Magick is taken from 0.1.2 within 0.1 rather than exactly 0.1.2, so a site can build with Magick's newer releases."

[[releases]]
version = "0.3.1"
date = 2026-10-21
summary = "A development build is named by the last number bumped under every versioning scheme: a decimal project's 1.0.0 is followed by 1.0.1-dev.N, a Jess version, never 1.0.01-dev.N."

[[releases]]
version = "0.3.0"
date = 2026-10-19
summary = "First release published as a DreamWeave project."
