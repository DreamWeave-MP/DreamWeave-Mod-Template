# Site configuration. This file is about the website; facts about a mod live in
# content/<project>/mod.toml. Zola reads this file; so does ./buildSite.

# Where the site lives. On GitHub Pages the workflow substitutes the real Pages URL, so this
# value matters for local previews and for links inside the offline documentation that ships
# in archives. Include the repository path for project sites: https://OWNER.github.io/REPO
base_url = "https://DreamWeave-MP.github.io/DreamWeave-Mod-Template"
title = "DreamWeave Mod Template"
description = "The canonical DreamWeave mod publishing format: a mod page, its docs, and the metadata tools need, from one repository."

compile_sass = true
build_search_index = true
generate_feeds = true
feed_filenames = ["atom.xml"]
taxonomies = [{ name = "tags", feed = false }]

# mod.toml and mod.lock are build inputs, not pages. The published manifests are generated
# from them under /dreamweave/.
ignored_content = ["**/mod.toml", "**/mod.lock"]

[search]
index_format = "fuse_json"
include_title = true
include_description = true
include_content = true
truncate_content_length = 400

[markdown]
highlighting = { theme = "dracula-soft" }
insert_anchor_links = "right"
smart_punctuation = true

[slugify]
paths = "safe"

[link_checker]
skip_prefixes = ["https://github.com/", "https://www.nexusmods.com/"]

[extra]
# REQUIRED. The GitHub repository that builds and publishes this site. Release downloads are
# served from its GitHub Releases, and CI refuses to build if these do not name the repository
# it is running in.
github_username = "DreamWeave-MP"
github_project = "DreamWeave-Mod-Template"

# Shown in the header. Defaults to `title`.
logo_text = "DreamWeave Mod Template"

# Palette: purple (DreamWeave), teal, gold, ember or moss. `accent` overrides the palette's
# accent with any #rrggbb color. Anything bigger belongs in sass/brand.sass.
palette = "purple"
# accent = "#b48cff"

# Header links. `url` may be a Zola @/ path or an absolute URL.
menu_items = [
    { name = "Candlelight", url = "@/home/index.md" },
    { name = "Guide", url = "@/guide/_index.md" },
    { name = "Network", url = "@/network.md" },
]

# Optional footer text. Plain text; the year is not added for you.
# footer_text = "Made by the Ashlands Lighting Collective"

# favicon = "img/favicon.png"

# Swap every heading (or only project titles) to one of the bundled fonts:
# avqest, gal-basic, mystic-cards, deja-vu-sans-mono, demonic-letters, oxanium.
# font_override = "oxanium"
# font_override_titles_only = true

# ---------------------------------------------------------------------------------------
# Optional services. Both are OFF until you configure your own accounts. A site built from
# this template never talks to DreamWeave's comment threads or analytics.

# Comments through GitHub Discussions. Get the values from https://giscus.app for YOUR repository.
# giscus = { repo = "OWNER/REPO", repo_id = "", category = "General", category_id = "", theme = "dark_dimmed" }

# Page-view counts from https://www.goatcounter.com, with YOUR code.
# goatcounter = "your-code"
