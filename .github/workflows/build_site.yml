name: Build, release and publish

# Pull requests: validate, test, build the site.
# Pushes to the default branch: all of that, then a fresh `development` release and the site.
# Tags (<slug>-<version>): rebuild that release, refuse it unless it matches mod.lock, publish its
# archive, then rebuild the site from the default branch so the release appears on it.
#
# The file name matters: Sigstore signatures name this workflow as the identity that signed.

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dreamweave-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: '3.12'

jobs:
  check:
    name: Validate and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python requirements
        run: python -m pip install -r tools/requirements.txt

      - name: Read the Zola version archives are rendered with
        id: zola
        run: echo "version=$(./buildSite zola-version)" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@v2
        with:
          tool: zola@${{ steps.zola.outputs.version }}

      - name: Validate every project
        run: ./buildSite check

      - name: Run the template's tests
        run: python -m unittest discover -s tests -v

  release-archive:
    name: Rebuild and verify the tagged release
    if: github.ref_type == 'tag'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    outputs:
      nexus: ${{ steps.nexus.outputs.uploads }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python requirements
        run: python -m pip install -r tools/requirements.txt

      - name: Read the Zola version archives are rendered with
        id: zola
        run: echo "version=$(./buildSite zola-version)" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@v2
        with:
          tool: zola@${{ steps.zola.outputs.version }}

      - name: Rebuild the release and compare it with mod.lock
        env:
          TAG: ${{ github.ref_name }}
        run: ./buildSite verify "$TAG"

      - name: Check whether anything asks to be signed
        id: signing
        run: |
          if [ -s dist/sign.txt ]; then echo "needed=true" >> "$GITHUB_OUTPUT"; else echo "needed=false" >> "$GITHUB_OUTPUT"; fi

      - uses: sigstore/cosign-installer@v3
        if: steps.signing.outputs.needed == 'true'

      - name: Sign archives with Sigstore (keyless)
        if: steps.signing.outputs.needed == 'true'
        working-directory: dist
        run: |
          while IFS= read -r archive; do
            cosign sign-blob --yes --bundle "$archive.sigstore.json" "$archive"
          done < sign.txt

      - name: Read the Nexus Mods uploads
        id: nexus
        run: echo "uploads=$(cat dist/nexus.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist/
          if-no-files-found: error

  site:
    name: Build the site
    needs: [check, release-archive]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.release-archive.result != 'failure' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
      id-token: write
    steps:
      # The site always describes the default branch, even when a tag triggered the run.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python requirements
        run: python -m pip install -r tools/requirements.txt

      - name: Read the Zola version archives are rendered with
        id: zola
        run: echo "version=$(./buildSite zola-version)" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@v2
        with:
          tool: zola@${{ steps.zola.outputs.version }}

      - name: Find the published site's URL
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Choose the base URL
        id: base
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          if [ -n "$PAGES_URL" ]; then
            echo "url=$PAGES_URL" >> "$GITHUB_OUTPUT"
          else
            echo "url=$(python -c 'import tomllib; print(tomllib.load(open("config.toml", "rb"))["base_url"])')" >> "$GITHUB_OUTPUT"
          fi

      - name: Package development builds and write the protocol files
        env:
          DREAMWEAVE_BASE_URL: ${{ steps.base.outputs.url }}
          DREAMWEAVE_DEVELOPMENT_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: ./buildSite build

      - name: Build the site
        env:
          BASE_URL: ${{ steps.base.outputs.url }}
        run: zola build --base-url "$BASE_URL"

      - name: Check local links and anchors
        env:
          BASE_URL: ${{ steps.base.outputs.url }}
        run: ./buildSite links --base-url "$BASE_URL"

      - name: Check whether anything asks to be signed
        id: signing
        run: |
          if [ -s dist/sign.txt ] && [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: sigstore/cosign-installer@v3
        if: steps.signing.outputs.needed == 'true'

      - name: Sign development archives with Sigstore (keyless)
        if: steps.signing.outputs.needed == 'true'
        working-directory: dist
        run: |
          while IFS= read -r archive; do
            cosign sign-blob --yes --bundle "$archive.sigstore.json" "$archive"
          done < sign.txt

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: public/

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request' && github.ref_type == 'branch'
        with:
          name: development
          path: dist/
          if-no-files-found: ignore

  release-cleanup:
    name: Recreate the GitHub release
    needs: [release-archive, site]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.site.result == 'success' && needs.release-archive.result != 'failure' }}
    permissions:
      contents: write
    uses: DreamWeave-MP/StroggForge/.github/workflows/createRelease.yml@v40
    secrets: inherit

  upload-release:
    name: Upload archives
    needs: [release-archive, site, release-cleanup]
    if: ${{ !cancelled() && needs.release-cleanup.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ github.ref_type == 'tag' && 'release' || 'development' }}
          path: dist/

      - name: Upload archives and signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE: ${{ needs.release-cleanup.outputs.release_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          shopt -s nullglob
          files=(dist/*.zip dist/*.sigstore.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No archives to upload."
            exit 0
          fi
          gh release upload "$RELEASE" "${files[@]}" --clobber --repo "$REPOSITORY"

      - name: Use the release's own notes
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE: ${{ needs.release-cleanup.outputs.release_name }}
          REPOSITORY: ${{ github.repository }}
        run: gh release edit "$RELEASE" --notes-file dist/release-notes.md --repo "$REPOSITORY"

  deploy:
    name: Deploy to GitHub Pages
    needs: [site, upload-release]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.site.result == 'success' && needs.upload-release.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  nexus-upload:
    name: Upload to Nexus Mods
    needs: [release-archive, upload-release]
    if: ${{ github.ref_type == 'tag' && needs.upload-release.result == 'success' && needs.release-archive.outputs.nexus != '[]' }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        upload: ${{ fromJson(needs.release-archive.outputs.nexus) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist/

      - uses: Nexus-Mods/upload-action@main
        with:
          api_key: ${{ secrets.NEXUS_API_KEY }}
          file_id: ${{ matrix.upload.file_group_id }}
          filename: dist/${{ matrix.upload.filename }}
          version: ${{ matrix.upload.version }}
          display_name: ${{ matrix.upload.name }}
          archive_existing_version: true
          primary_mod_manager_download: true
          update_mod_version: true
